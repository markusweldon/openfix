<text x="130" y="64.0" fill="#D7B0FF" font-size="17" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">OPENFIX / CUSTOMER WORKFLOW / VISUAL REFERENCE</text>
<text x="70" y="181.0" fill="#FAF6FF" font-size="56" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">The complete security loop</text>
<text x="74" y="251.0" fill="#D0C1DF" font-size="25" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400">Evidence, acceptance, verification, and closure are separate decisions.</text>
