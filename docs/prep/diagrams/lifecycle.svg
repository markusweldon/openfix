<text x="73" y="866.0" fill="#D0C1DF" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" font-weight="400">Independent project • Synthetic practice scenario • No production results claimed</text>
<text x="1450" y="866.0" fill="#D7B0FF" font-size="21" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700">03</text>
