<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#000000"/>

  <text x="800" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="url(#titleGrad)">OpenFix - SDLC remediation lane</text>
  <rect x="668" y="74" width="264" height="22" rx="4" fill="#0f172a" stroke="#1e3a5f"/>
  <text x="800" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e2e8f0">PIPELINE ARCHITECTURE</text>

  <!-- DETECT -->
  <rect x="48" y="140" width="280" height="420" rx="6" fill="#050505" stroke="#334155" stroke-width="1.5"/>
  <rect x="48" y="140" width="4" height="420" fill="url(#barGrad)"/>
  <text x="72" y="172" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">DETECT plane</text>
  <text x="72" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">deterministic - outside agents</text>

  <rect x="72" y="220" width="232" height="88" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="88" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">CI scanners</text>
  <text x="88" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">Semgrep / Snyk / CodeQL</text>
  <text x="88" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">(+ OSV / GHAS / ...)</text>

  <line x1="188" y1="308" x2="188" y2="348" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="72" y="352" width="232" height="72" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="88" y="382" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">SARIF / JSON</text>
  <text x="88" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">CI interchange artifacts</text>

  <rect x="72" y="460" width="232" height="72" rx="4" fill="#000000" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="88" y="490" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">MCP stub (demo only)</text>
  <text x="88" y="512" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">simulated Semgrep / Snyk</text>

  <!-- OPENFIX -->
  <rect x="400" y="140" width="520" height="420" rx="6" fill="#050505" stroke="#334155" stroke-width="1.5"/>
  <rect x="400" y="140" width="4" height="420" fill="url(#barGrad)"/>
  <text x="424" y="172" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">OPENFIX control plane</text>
  <text x="424" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">policy / queue / run provenance</text>

  <rect x="424" y="220" width="200" height="96" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="440" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">ingest</text>
  <text x="440" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#67e8f9">run context</text>
  <text x="440" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">repo / SHA / run id</text>

  <line x1="624" y1="268" x2="668" y2="268" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="672" y="220" width="220" height="96" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="688" y="248" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">policy.yaml</text>
  <text x="688" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">deterministic triage</text>
  <text x="688" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">outside the model</text>

  <line x1="782" y1="316" x2="782" y2="360" stroke="#67e8f9" stroke-width="2"/>
  <line x1="782" y1="360" x2="540" y2="360" stroke="#67e8f9" stroke-width="2"/>
  <line x1="782" y1="360" x2="840" y2="360" stroke="#64748b" stroke-width="1.5"/>
  <line x1="540" y1="360" x2="540" y2="388" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="360" x2="840" y2="388" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowMuted)"/>

  <rect x="424" y="392" width="232" height="72" rx="4" fill="#0a0a0a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="440" y="422" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">auto_fix queue</text>
  <text x="440" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">severity-ordered / bot-eligible</text>

  <rect x="700" y="392" width="192" height="72" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="716" y="422" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">human_only</text>
  <text x="716" y="444" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">secrets / auth / critical</text>
  <text x="716" y="500" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">-&gt; humans (no agent)</text>

  <line x1="328" y1="388" x2="418" y2="268" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M304,496 C360,496 380,300 420,280" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowMuted)"/>

  <!-- CURSOR -->
  <rect x="980" y="180" width="260" height="280" rx="6" fill="#050505" stroke="#334155" stroke-width="1.5"/>
  <rect x="980" y="180" width="4" height="280" fill="url(#barGrad)"/>
  <text x="1004" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">CURSOR cloud</text>
  <text x="1004" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">workers / durable agents</text>

  <rect x="1004" y="260" width="212" height="80" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="1020" y="290" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">agents (bc-...)</text>
  <text x="1020" y="314" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">concurrent lanes</text>

  <line x1="1110" y1="340" x2="1110" y2="372" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1004" y="376" width="212" height="56" rx="4" fill="#0a0a0a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1020" y="410" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Draft fix PRs</text>

  <line x1="656" y1="428" x2="974" y2="300" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- VERIFY -->
  <rect x="1300" y="140" width="260" height="420" rx="6" fill="#050505" stroke="#334155" stroke-width="1.5"/>
  <rect x="1300" y="140" width="4" height="420" fill="url(#barGrad)"/>
  <text x="1324" y="172" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">VERIFY / AUTHORIZE</text>
  <text x="1324" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">system of record</text>

  <rect x="1324" y="220" width="212" height="72" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="1340" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">App CI</text>
  <text x="1340" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">unit + scanner re-run</text>

  <line x1="1430" y1="292" x2="1430" y2="328" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1324" y="332" width="212" height="64" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="1340" y="370" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Human review</text>

  <line x1="1430" y1="396" x2="1430" y2="432" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1324" y="436" width="212" height="56" rx="4" fill="#0a0a0a" stroke="#475569"/>
  <text x="1340" y="470" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Merge</text>

  <text x="1324" y="530" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#67e8f9">Never auto-merge</text>

  <line x1="1216" y1="404" x2="1294" y2="256" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M892,464 C1100,520 1200,520 1300,364" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <rect x="48" y="600" width="1504" height="100" rx="6" fill="#050505" stroke="#1e293b"/>
  <text x="72" y="640" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Placement</text>
  <text x="72" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">GitHub Action (thin hook) invokes OpenFix in each app pipeline after scanners. Cursor hosts agent VMs. App CI gates the fix PR.</text>

  <text x="800" y="760" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Actions = hook  |  OpenFix = control plane  |  Cursor cloud = workers  |  Humans + App CI = authority</text>
  <text x="800" y="840" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Detect != remediate != authorize</text>
</svg>
