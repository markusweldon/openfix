const data=JSON.parse(document.getElementById('casebook').textContent);let selected=data.cases[0]?.id;const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=typeof text==='string'?text:JSON.stringify(text);if(cls)n.className=cls;return n};const chip=(text,cls='')=>el('span',text,'chip '+cls);const panel=(title)=>{const n=el('section',undefined,'panel');n.append(el('h3',title));return n};const fact=(parent,key,value)=>{const n=el('div',undefined,'fact');n.append(el('div',key,'key'),el('div',value==null?'Not established':value,'value'));parent.append(n)};const details=(title,value)=>{const n=el('details');n.append(el('summary',title),el('pre',JSON.stringify(value,null,2)));return n};

function show(){const c=data.cases.find(x=>x.id===selected),root=$('detail');root.replaceChildren();if(!c){root.append(el('div','No cases. Import a supported report to start.','empty'));return}const a=c.assessment;root.append(el('h2',c.title));const next=panel('NEXT DECISION');next.classList.add('next');next.append(el('div',a.nextAction),chip('Suggested '+a.priority.label+' / '+a.priority.score),chip(a.remediationAllowed?'Remediation scope accepted':'Remediation gate closed',a.remediationAllowed?'good':'warn'));root.append(next);const grid=el('div',undefined,'grid');root.append(grid);

const lineage=panel('Evidence ledger');lineage.classList.add('wide');for(const e of c.evidence){const n=el('div',undefined,'evidence');n.append(chip(e.origin),chip(e.freshness,e.freshness==='fresh'?'good':'warn'),el('b',e.kind+' · '+e.producer),el('div',e.authority+' · '+(e.collectedAt||'Time not supplied'),'tiny'),details('Value and provenance',{value:e.value,revision:e.revision,sourceRef:e.sourceRef,artifactDigest:e.artifactDigest,id:e.id}));lineage.append(n)}if(!c.evidence.length)lineage.append(el('div','No enrichment supplied. Import preserves the original source record.'));grid.append(lineage);
