[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openfix"
version = "0.3.0.dev0"
description = "Model-agnostic security remediation agent. Every fix ships with proof."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Markus Weldon" }]
keywords = ["security", "remediation", "sarif", "appsec", "llm", "agent", "devsecops", "autofix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.69", "openai>=1.50", "google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
openfix = "openfix.cli:main"

[project.urls]
Homepage = "https://github.com/markusweldon/openfix"
Issues = "https://github.com/markusweldon/openfix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S404"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
