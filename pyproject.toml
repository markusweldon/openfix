[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "openfix-cli"
description = "Model-agnostic security remediation agent. Every fix ships with proof."
dynamic = ["version", "readme"]
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Markus Weldon" }]
keywords = ["security", "remediation", "sarif", "appsec", "llm", "agent", "devsecops", "autofix"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.69"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.69", "openai>=1.50", "google-genai>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
openfix = "openfix.cli:main"

[project.urls]
Homepage = "https://github.com/markusweldon/openfix"
Documentation = "https://github.com/markusweldon/openfix#documentation"
Issues = "https://github.com/markusweldon/openfix/issues"
Changelog = "https://github.com/markusweldon/openfix/releases"

[tool.hatch.version]
path = "src/openfix/__init__.py"

# PyPI can't resolve the README's relative links, so point images at raw files and links at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/markusweldon/openfix/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/markusweldon/openfix/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/markusweldon/openfix/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/openfix"]

[tool.hatch.build.targets.sdist]
include = ["/src/openfix", "/tests", "/examples", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "S404"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
