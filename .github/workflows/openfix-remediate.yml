# Optional legacy Cursor remediation adapter. The v0.2 case runtime is the default CLI.
#
# PURPOSE:
#   Scanners finish → this workflow runs OpenFix → Cursor cloud agents open fix PRs.
#   This manual example does not provide the v0.2 validation/evidence gates.
#
# Same-repo placement (recommended): install this workflow in the app repo —
# target URL + SHA come from github.repository / github.sha (no URL secret).
# Cross-repo: set OPENFIX_TARGET_REPO when this job remediates a different repo.
#
# Demo: Actions → "OpenFix: SARIF → fix PRs" → Run workflow (manual).
# Requires repo secret: CURSOR_API_KEY

name: "Legacy Cursor adapter: SARIF → fix PRs"

on:
  workflow_dispatch:
    inputs:
      sarif_path:
        description: Path to SARIF in this repo
        required: true
        default: fixtures/findings/demo.sarif
      all_auto:
        description: "Remediate multiple auto_fix findings in one run"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  openfix:
    name: Ingest → triage → Cursor remediate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout OpenFix
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Explain why this job exists
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # OpenFix remediation lane

          **Why this workflow matters**

          | Plane | Who | This job |
          | --- | --- | --- |
          | Detect | Semgrep / Snyk / CodeQL (earlier CI) | Input = SARIF |
          | Remediate | **OpenFix + Cursor cloud agents** | **This workflow** |
          | Verify | App CI + scanner re-run on the fix PR | Next stage |
          | Authorize | Humans | Merge the PR |

          Target repo / SHA are taken from `github.repository` / `github.sha`
          so the same Action works in each app pipeline without hardcoding URLs.
          EOF

      - name: Ingest SARIF + triage
        id: triage
        env:
          SARIF_PATH: ${{ inputs.sarif_path }}
          # Pipeline run context — binds findings to this snapshot
          OPENFIX_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          OPENFIX_COMMIT_SHA: ${{ github.sha }}
          # Same-repo: derive https://github.com/${{ github.repository }}
          # Optional override for cross-repo orchestrator:
          # OPENFIX_TARGET_REPO: ${{ secrets.OPENFIX_TARGET_REPO }}
        run: |
          npx tsx src/cli.ts ingest "$SARIF_PATH"
          npx tsx src/cli.ts triage | tee triage.out
          {
            echo "## Triage (policy — no LLM)"
            echo '```'
            cat triage.out
            echo '```'
            if [ -f .openfix/state.json ]; then
              echo ""
              echo "## OpenFix run context"
              echo '```json'
              jq '.currentRun' .openfix/state.json 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cursor cloud remediate (live)
        id: remediate
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENFIX_RUN_ID: ${{ github.run_id }}.${{ github.run_attempt }}
          OPENFIX_COMMIT_SHA: ${{ github.sha }}
          OPENFIX_MODEL: composer-2.5
          OPENFIX_MAX_CONCURRENT: "2"
          # Optional: OPENFIX_TARGET_REPO when remediating a different repo than this workflow
          OPENFIX_TARGET_REPO: ${{ secrets.OPENFIX_TARGET_REPO }}
        run: |
          EXTRA=()
          if [ "${{ inputs.all_auto }}" = "true" ]; then
            EXTRA+=(--all-auto)
          fi
          npx tsx src/cli.ts remediate "${EXTRA[@]}" | tee remediate.out
          {
            echo "## Remediation (Cursor SDK)"
            echo '```'
            tail -n 80 remediate.out
            echo '```'
            echo ""
            echo "Look for draft PR URLs above — they still need app CI + human review before merge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenFix run context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openfix-run-${{ github.run_id }}
          path: |
            .openfix/state.json
            .openfix/runs/
          if-no-files-found: ignore

      - name: Pre-merge verify (App CI poll)
        run: |
          npx tsx src/cli.ts verify --last | tee verify.out
          {
            echo "## Before anyone merges"
            echo '```'
            cat verify.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

