name: Release
# Publishing a GitHub release (tag vX.Y.Z) builds OpenFix and uploads it to PyPI with trusted publishing:
# PyPI trusts this workflow through OIDC, so no API token is stored anywhere.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/openfix/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match __version__ $version"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openfix
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
