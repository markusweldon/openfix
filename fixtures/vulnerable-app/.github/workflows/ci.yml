# App CI on remediation PRs — system of record before merge.
#
# Cursor opens the fix PR; these Checks run before a human merges.
# Agents do not self-attest. Lean 2 jobs keep free-tier runners fast.
# pull_request on the agent PR is enough — OpenFix does not empty-commit.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Unit tests

          OpenFix agents propose patches. **This job proves the app still works.**
          Flow: scanner finding → Cursor fix PR → **these checks** → human merge
          EOF

  scanner-rerun:
    name: Scanner re-run (detective control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate scanner re-run on fix PR
        run: |
          echo "Simulated: Semgrep / OSV / secrets / CodeQL on the fix PR"
          echo "Production: fail if the original finding still fires in fresh SARIF."
      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Scanner re-run (detective control)

          Deterministic re-check on the **fix PR** (not agent prose).

          In production this job is Semgrep + OSV/SCA + secret scan + CodeQL.
          Fresh SARIF must show the finding cleared — that closes the loop.

          Prototype stub — always green; replace with real scanners in production.
          EOF
